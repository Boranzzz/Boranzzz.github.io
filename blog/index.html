<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — Brian Boran Zhang</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png" />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fafaf8;
        --ink: #1f2328;
        --ink-strong: #0f1216;
        --muted: #5c6570;
        --line: #e6e4df;
        --link: #1d4e63;
        --link-hover: #0f3444;
        --measure: 56rem;
        --pad: 1.25rem;
        --font: "Source Serif 4", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html { scrollbar-gutter: stable; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 1.05rem;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .site-nav { border-bottom: 1px solid var(--line); }
      .site-nav-inner {
        position: relative;
        max-width: var(--measure);
        margin: 0 auto;
        padding: 0.85rem var(--pad);
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }
      .nav-tagline {
        max-width: var(--measure);
        margin: -0.72rem auto 0;
        padding: 0 var(--pad) 0.55rem;
        color: #8b939c;
        font-size: 0.75rem;
        font-style: italic;
        line-height: 1;
      }
      .nav-name {
        position: absolute;
        left: var(--pad);
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-strong);
        text-decoration: none;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.2;
        white-space: nowrap;
      }
      .nav-name:hover { color: var(--link); }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        margin-left: auto;
        flex: 0 0 auto;
      }
      .nav-links a {
        display: inline-grid;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 400;
        line-height: 1.2;
      }
      .nav-links a span,
      .nav-links a::before {
        grid-area: 1 / 1;
      }
      .nav-links a::before {
        content: attr(data-text);
        font-weight: 600;
        visibility: hidden;
        pointer-events: none;
      }
      .nav-links a:hover { color: var(--link); }
      .nav-links a[aria-current="page"] {
        color: var(--ink-strong);
      }
      .nav-links a[aria-current="page"] span {
        font-weight: 600;
      }
      .nav-toggle {
        display: none;
        position: relative;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .nav-toggle-text {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .nav-toggle-icon,
      .nav-toggle-icon::before,
      .nav-toggle-icon::after {
        display: block;
        width: 1.15rem;
        height: 1px;
        background: var(--ink-strong);
      }
      .nav-toggle-icon { position: relative; margin: 0 auto; }
      .nav-toggle-icon::before,
      .nav-toggle-icon::after {
        content: "";
        position: absolute;
        left: 0;
      }
      .nav-toggle-icon::before { top: -0.34rem; }
      .nav-toggle-icon::after { top: 0.34rem; }
      .site-nav.is-open .nav-toggle-icon { background: transparent; }
      .site-nav.is-open .nav-toggle-icon::before { top: 0; transform: rotate(45deg); }
      .site-nav.is-open .nav-toggle-icon::after { top: 0; transform: rotate(-45deg); }
      @media (max-width: 720px) {
        .site-nav {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          column-gap: 0.75rem;
          align-items: center;
          padding: 0.85rem var(--pad) 0.7rem;
        }
        .site-nav-inner { display: contents; }
        .nav-name {
          position: static;
          transform: none;
          grid-column: 1;
          grid-row: 1;
          justify-self: start;
        }
        .nav-tagline {
          grid-column: 1;
          grid-row: 2;
          justify-self: start;
          margin: 0.12rem 0 0;
          padding: 0;
          max-width: none;
        }
        .nav-toggle {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          grid-column: 2;
          grid-row: 1 / span 2;
          justify-self: end;
        }
        .nav-links {
          display: none;
          grid-column: 1 / -1;
          grid-row: 3;
          margin: 0.75rem 0 0;
          padding-top: 0.35rem;
          border-top: 1px solid var(--line);
          flex-direction: column;
          align-items: flex-start;
          gap: 0.1rem;
        }
        .site-nav.is-open .nav-links { display: flex; }
        .nav-links a { padding: 0.4rem 0; font-size: 1rem; }
      }
      .container {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 2.25rem var(--pad) 4rem;
      }
      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--ink-strong);
      }
      .entry-status {
        margin: 0 0 0.4rem;
        font-size: 0.82rem;
        font-style: italic;
        line-height: 1.3;
        color: var(--muted);
      }
      .entry-title {
        margin: 0 0 0.5rem;
        font-size: 1.05rem;
        font-weight: 500;
        line-height: 1.65;
      }
      .entry-title a {
        color: var(--link);
        text-decoration: none;
        font-weight: 500;
      }
      .entry-title a:hover {
        color: var(--link-hover);
      }
      .entry-title .subtitle {
        display: block;
        line-height: 1.5;
      }
      .entry-desc {
        margin: 0;
        max-width: 38rem;
        font-size: 0.9rem;
        line-height: 1.55;
        color: var(--muted);
      }
      .entry + .entry {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav-inner">
        <a class="nav-name" href="../">Brian Boran Zhang</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
          <span class="nav-toggle-text">Menu</span>
          <span class="nav-toggle-icon" aria-hidden="true"></span>
        </button>
        <div class="nav-links" id="nav-menu">
          <a href="../" data-text="Home"><span>Home</span></a>
          <a href="../research/" data-text="Research"><span>Research</span></a>
          <a href="./" data-text="Blog" aria-current="page"><span>Blog</span></a>
          <a href="../cv/" data-text="CV"><span>CV</span></a>
        </div>
      </div>
    </nav>
    <div class="container">
      <h1>Blog</h1>
    </div>
    <script>
      (function () {
        var nav = document.querySelector(".site-nav");
        var button = nav && nav.querySelector(".nav-toggle");
        var label = button && button.querySelector(".nav-toggle-text");
        if (!button) return;
        button.addEventListener("click", function () {
          var open = nav.classList.toggle("is-open");
          button.setAttribute("aria-expanded", open ? "true" : "false");
          if (label) label.textContent = open ? "Close" : "Menu";
        });
      })();
    </script>
  </body>
</html>
